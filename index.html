<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101010" />
    <meta name="description" content="Георгий Рожин — фотограф. Внимание к свету, человеку и моменту." />
    <title>Георгий Рожин — фотограф</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/manrope-variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" crossorigin href="./assets/index-DUzrsg1_.css">
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <span class="wordmark" aria-label="Георгий Рожин">gr<span class="wordmark-dot">.</span></span>
        <span class="masthead-label">Независимый взгляд</span>
        <span class="profession" lang="en">Photographer</span>
      </header>

      <main>
        <section class="hero" aria-labelledby="name">
          <div class="introduction">
            <p class="eyebrow"><span class="short-rule" aria-hidden="true"></span>Свет. Человек. Момент.</p>
            <h1 id="name"><span>Георгий</span> <span class="surname">Рожин<span class="name-period">.</span></span></h1>
            <div class="statement">
              <svg class="statement-mark" aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M5 19 19 5M5 5h14v14" stroke="currentColor" stroke-width="1.2" /></svg>
              <p>Замечать простое.<br />Видеть по-своему.</p>
            </div>
          </div>

          <figure class="photo-space" aria-label="Место для будущей авторской фотографии">
            <!-- Replace .empty-frame with an img when an original photograph is available.
                 Keep its aspect ratio and supply a meaningful alt description. -->
            <div class="empty-frame">
              <div class="frame-heading" aria-hidden="true"><span>01</span><span>В поиске кадра</span></div>
              <span class="corner corner-tl" aria-hidden="true"></span>
              <span class="corner corner-tr" aria-hidden="true"></span>
              <span class="corner corner-bl" aria-hidden="true"></span>
              <span class="corner corner-br" aria-hidden="true"></span>
              <div class="viewfinder" aria-hidden="true"><span></span></div>
              <p class="frame-thought">Всё начинается<br />со взгляда.</p>
              <span class="frame-bottom" aria-hidden="true">Смотреть. Чувствовать. Сохранять.</span>
            </div>
            <figcaption><span class="caption-dot" aria-hidden="true"></span>Место для будущей фотографии</figcaption>
          </figure>
        </section>
      </main>

      <footer class="hero-footer">
        <span lang="en">Georgiy Rozhin</span>
        <span class="footer-note">Фотография как способ видеть</span>
        <span class="footer-symbol" aria-hidden="true">[ GR ]</span>
      </footer>
    </div>
  </body>
</html>
